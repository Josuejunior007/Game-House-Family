server.port=8081

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# O pooler de sessão do Supabase (porta 5432) limita o TOTAL de clientes (15 no plano free).
# O pool padrão do Hikari é 10 por instância: duas instâncias — ou um restart enquanto as
# conexões antigas não expiram — estouram o limite e o banco recusa conexões
# ("max clients reached in session mode"). 5 por instância sobra.
spring.datasource.hikari.maximum-pool-size=${APP_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Roda o data.sql DEPOIS do Hibernate criar/ajustar as tabelas (índice único parcial: 1 sugestão ativa por jogo)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# URL pública desta API (usada no retorno do login Steam)
app.base-url=${APP_BASE_URL:http://localhost:8081}
# Opcional: URL do front-end (libera CORS e redireciona para lá depois do login)
app.frontend-url=${APP_FRONTEND_URL:}
# Opcional: SteamID64 da família separados por vírgula. Vazio = qualquer conta Steam entra
app.allowed-steam-ids=${APP_ALLOWED_STEAM_IDS:}
# Login falso para testes (POST /auth/dev-login). Deixe false fora do ambiente de desenvolvimento
app.dev-login-enabled=${APP_DEV_LOGIN_ENABLED:false}

server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax
